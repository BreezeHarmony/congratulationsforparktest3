<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卒業おめでとうメッセージボード</title>
<style>
  :root{
    --bg1:#fff6e8; --bg2:#ffeede; --ink:#4a3b2a; --accent:#d98c3d; --accent2:#7a9e7e;
    --card-radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#f3e3ff);
    color:var(--ink); min-height:100vh;
  }
  header.app-header{
    text-align:center; padding:28px 16px 12px;
  }
  header.app-header h1{
    margin:0 0 4px; font-size:1.5rem;
  }
  header.app-header .sub{
    color:#8a7a63; font-size:.95rem;
  }
  nav.tabs{
    display:flex; justify-content:center; gap:8px; margin:18px 0 8px; flex-wrap:wrap;
  }
  nav.tabs button{
    border:none; background:#fff; color:var(--ink); padding:10px 20px; border-radius:999px;
    font-size:1rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.08); transition:.2s;
  }
  nav.tabs button.active{ background:var(--accent); color:#fff; }
  main{ max-width:760px; margin:0 auto; padding:8px 16px 60px; }
  .card-panel{
    background:rgba(255,255,255,.85); border-radius:20px; padding:22px;
    box-shadow:0 6px 20px rgba(0,0,0,.06); margin-bottom:18px;
  }
  .hidden{ display:none !important; }
  label{ display:block; font-weight:600; margin:14px 0 6px; font-size:.92rem; }
  input[type=text], input[type=email], input[type=date], textarea{
    width:100%; padding:10px 12px; border:1px solid #e0d2bd; border-radius:10px;
    font-size:1rem; font-family:inherit; background:#fffdf9;
  }
  textarea{ min-height:100px; resize:vertical; }
  .charcount{ text-align:right; font-size:.8rem; color:#a08f72; }
  .swatches{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .swatch{
    width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  button.action{
    border:none; padding:12px 18px; border-radius:12px; font-size:.95rem; cursor:pointer;
    color:#fff; font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12);
  }
  button.action.secondary{ background:#8aa98f; }
  button.action.mail{ background:#d98c3d; }
  button.action.share{ background:#5b8ac1; }
  button.action.danger{ background:#c15b5b; }
  button.action.ghost{ background:#fff; color:var(--ink); border:1px solid #ddd; box-shadow:none; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#4a3b2a; color:#fff; padding:10px 20px; border-radius:999px; font-size:.9rem;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:999;
  }
  .toast.show{ opacity:.95; }
  .msg-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .msg-item{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:14px;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .msg-item .dot{ width:14px; height:14px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .msg-item .body{ flex:1; }
  .msg-item .name{ font-weight:700; font-size:.9rem; }
  .msg-item .text{ font-size:.9rem; white-space:pre-wrap; margin-top:2px; }
  .msg-item .ops{ display:flex; gap:6px; }
  .msg-item .ops button{
    border:none; background:#f1ede3; border-radius:8px; padding:4px 8px; cursor:pointer; font-size:.85rem;
  }
  .count-badge{
    display:inline-block; background:var(--accent); color:#fff; border-radius:999px;
    padding:2px 10px; font-size:.8rem; margin-left:6px;
  }
  .hint{ font-size:.82rem; color:#8a7a63; line-height:1.5; }
  .config-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:520px){ .config-grid{ grid-template-columns:1fr; } }

  /* ---- Presentation overlay ---- */
  #presentOverlay{
    position:fixed; inset:0; background:radial-gradient(circle at top,#fff8ec,#f6e3d0 70%);
    z-index:1000; overflow-y:auto; padding:30px 16px 60px;
  }
  #presentOverlay .close{
    position:fixed; top:16px; right:16px; width:42px; height:42px; border-radius:50%;
    border:none; background:#fff; font-size:1.3rem; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:1001;
  }
  #presentOverlay .fullscreen-btn{
    position:fixed; top:16px; right:68px; border:none; background:#fff; border-radius:999px;
    padding:10px 16px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:1001; font-size:.9rem;
  }
  .present-title{ text-align:center; margin:10px 0 30px; }
  .present-title h2{ font-size:2rem; margin:0 0 6px; }
  .present-title .cap{ font-size:2.6rem; }
  .board-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px; max-width:1100px; margin:0 auto;
  }
  .note-card{
    border-radius:16px; padding:18px; box-shadow:0 6px 14px rgba(0,0,0,.12);
    transform:rotate(var(--rot)); opacity:0; animation:popin .5s forwards;
    min-height:140px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .note-card .text{ font-size:1rem; white-space:pre-wrap; line-height:1.5; }
  .note-card .from{ margin-top:10px; font-weight:700; text-align:right; font-size:.95rem; }
  @keyframes popin{ from{opacity:0; transform:rotate(var(--rot)) translateY(14px) scale(.9);} to{opacity:1; transform:rotate(var(--rot)) translateY(0) scale(1);} }
  @media print {
    nav.tabs, .btnrow, #presentOverlay .close, #presentOverlay .fullscreen-btn { display:none !important; }
    #presentOverlay{ position:static; }
    .note-card{ break-inside:avoid; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1 id="headerTitle">🎓 卒業おめでとうメッセージボード</h1>
  <div class="sub" id="headerSub">学友からのお祝いメッセージを集めよう</div>
</header>

<nav class="tabs">
  <button id="tabBtnSend" class="active" onclick="switchTab('send')">✉️ メッセージを送る</button>
  <button id="tabBtnBoard" onclick="switchTab('board')">🎓 ボード（主催者用）</button>
</nav>

<main>

  <!-- ============ SEND TAB ============ -->
  <section id="sendTab" class="card-panel">
    <p class="hint" id="sendIntro"></p>

    <label for="senderName">あなたの名前（卒業生に伝わる表示名）</label>
    <input type="text" id="senderName" placeholder="例）サークル同期の〇〇">

    <label for="senderMsg">お祝いメッセージ</label>
    <textarea id="senderMsg" maxlength="400" placeholder="〇〇さん、ご卒業おめでとうございます！&#10;一緒に過ごした時間は一生の思い出です。これからのご活躍を応援しています！"></textarea>
    <div class="charcount"><span id="charCount">0</span> / 400</div>

    <label>カードの色を選ぶ</label>
    <div class="swatches" id="swatches"></div>

    <div class="btnrow">
      <button class="action mail" onclick="sendByMail()">✉️ メールで送る</button>
      <button class="action share" onclick="sendByShare()">📤 LINEなどで共有</button>
      <button class="action secondary" onclick="addDirectlyToBoard()">📌 この端末のボードに直接追加</button>
    </div>
    <p class="hint">※「メールで送る」「LINEなどで共有」は、自分のメールアプリ・LINEが開くので内容を確認してから送信してください。<br>※すでに主催者の手元にある端末で入力している場合は「ボードに直接追加」を使うと、すぐにボードへ反映されます。</p>
  </section>

  <!-- ============ BOARD TAB ============ -->
  <section id="boardTab" class="card-panel hidden">
    <h3 style="margin-top:0">⚙️ 設定</h3>
    <div class="config-grid">
      <div>
        <label for="cfgName">卒業生の呼び方（愛称）</label>
        <input type="text" id="cfgName" placeholder="例）はなちゃん">
      </div>
      <div>
        <label for="cfgDate">卒業式 / 贈呈日</label>
        <input type="date" id="cfgDate">
      </div>
      <div style="grid-column:1/-1">
        <label for="cfgEmail">メッセージ受け取り用メールアドレス（送るタブの初期宛先）</label>
        <input type="email" id="cfgEmail">
      </div>
    </div>
    <div class="btnrow"><button class="action secondary" onclick="saveConfig()">💾 設定を保存</button></div>

    <h3>📝 メッセージを手動で追加（メールやLINEで届いた分を転記）</h3>
    <label for="manName">送信者名</label>
    <input type="text" id="manName">
    <label for="manMsg">メッセージ</label>
    <textarea id="manMsg" maxlength="400"></textarea>
    <label>色</label>
    <div class="swatches" id="swatchesManual"></div>
    <div class="btnrow"><button class="action mail" onclick="addManual()">➕ 追加</button></div>

    <h3>📬 集まったメッセージ <span class="count-badge" id="msgCount">0</span></h3>
    <div class="msg-list" id="msgList"></div>

    <div class="btnrow" style="margin-top:22px">
      <button class="action" style="background:var(--accent2)" onclick="openPresent()">🎓 ボードを表示する</button>
      <button class="action ghost" onclick="exportJson()">📥 バックアップ書き出し</button>
      <button class="action ghost" onclick="document.getElementById('importFile').click()">📤 読み込み</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importJson(event)">
      <button class="action danger" onclick="clearAll()">🗑 全て削除</button>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<!-- ============ PRESENTATION OVERLAY ============ -->
<div id="presentOverlay" class="hidden">
  <button class="close" onclick="closePresent()">✕</button>
  <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全画面</button>
  <div class="present-title">
    <div class="cap">🎓🌸🎉</div>
    <h2 id="presentTitle">〇〇さん 卒業おめでとう！</h2>
    <div id="presentSub" class="hint"></div>
  </div>
  <div class="board-grid" id="boardGrid"></div>
</div>

<script>
/* =========================================================
   CONFIG（必要ならここを編集してから配布してもOK。
   URLパラメータ ?name=〇〇&email=xxx@example.com でも上書きできます）
   ========================================================= */
const DEFAULT_CONFIG = {
  name: "",
  date: "",
  email: "mykikko13113@gmail.com"
};
const COLORS = ["#FFE1B8","#FFD1DE","#D8F2DE","#D6E7FF","#FFF4B8","#E6D8FF","#D8F4F0"];

const qs = new URLSearchParams(location.search);
function loadConfig(){
  let cfg = JSON.parse(localStorage.getItem("gradAppConfig") || "null") || {...DEFAULT_CONFIG};
  if (qs.get("name")) cfg.name = qs.get("name");
  if (qs.get("email")) cfg.email = qs.get("email");
  if (qs.get("date")) cfg.date = qs.get("date");
  if (!cfg.date){
    const d = new Date(); d.setDate(d.getDate()+1);
    cfg.date = d.toISOString().slice(0,10);
  }
  return cfg;
}
let config = loadConfig();
function saveConfigObj(){ localStorage.setItem("gradAppConfig", JSON.stringify(config)); }

function loadMessages(){ return JSON.parse(localStorage.getItem("gradAppMessages") || "[]"); }
function saveMessages(list){ localStorage.setItem("gradAppMessages", JSON.stringify(list)); }

let selectedColor = COLORS[Math.floor(Math.random()*COLORS.length)];
let selectedColorManual = COLORS[0];

function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${y}年${m}月${d}日`;
}

function refreshHeader(){
  const nm = config.name || "〇〇";
  document.getElementById("headerTitle").textContent = `🎓 ${nm}さん 卒業おめでとうメッセージボード`;
  document.getElementById("headerSub").textContent = config.date ? `${fmtDate(config.date)} 贈呈予定` : "学友からのお祝いメッセージを集めよう";
  document.getElementById("sendIntro").textContent = `${nm}さんへのお祝いメッセージを書いてください。あなたの言葉が、きっと素敵な卒業の思い出になります。`;
  document.getElementById("cfgName").value = config.name;
  document.getElementById("cfgDate").value = config.date;
  document.getElementById("cfgEmail").value = config.email;
}

function buildSwatches(containerId, onPick, initial){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  COLORS.forEach(c=>{
    const sw = document.createElement("div");
    sw.className = "swatch" + (c===initial ? " selected":"");
    sw.style.background = c;
    sw.onclick = ()=>{
      [...el.children].forEach(x=>x.classList.remove("selected"));
      sw.classList.add("selected");
      onPick(c);
    };
    el.appendChild(sw);
  });
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function switchTab(which){
  document.getElementById("sendTab").classList.toggle("hidden", which!=="send");
  document.getElementById("boardTab").classList.toggle("hidden", which!=="board");
  document.getElementById("tabBtnSend").classList.toggle("active", which==="send");
  document.getElementById("tabBtnBoard").classList.toggle("active", which==="board");
  if(which==="board") renderMsgList();
}

/* ---------- SEND TAB ---------- */
document.getElementById("senderMsg").addEventListener("input", e=>{
  document.getElementById("charCount").textContent = e.target.value.length;
});

function getSenderInput(){
  const name = document.getElementById("senderName").value.trim();
  const msg = document.getElementById("senderMsg").value.trim();
  return {name, msg};
}
function validateSender(){
  const {name, msg} = getSenderInput();
  if(!name){ showToast("名前を入力してください"); return null; }
  if(!msg){ showToast("メッセージを入力してください"); return null; }
  return {name, msg};
}

function sendByMail(){
  const v = validateSender(); if(!v) return;
  const subject = `【卒業おめでとう】${config.name || ""}さんへのメッセージ（送信者：${v.name}）`;
  const body = `送信者名：${v.name}\nカラー：${selectedColor}\n\n${v.msg}\n\n---\nこのメールの本文をそのままボード用アプリの「メッセージを手動で追加」に転記してください。`;
  location.href = `mailto:${encodeURIComponent(config.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function sendByShare(){
  const v = validateSender(); if(!v) return;
  const text = `【${config.name || "卒業生"}さんへのお祝いメッセージ】\n送信者：${v.name}\n\n${v.msg}`;
  if(navigator.share){
    try{ await navigator.share({title:"卒業おめでとうメッセージ", text}); return; }catch(e){ /* user cancelled */ return; }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast("コピーしました。LINEやメールに貼り付けて送ってください");
  }catch(e){
    alert(text);
  }
}

function addDirectlyToBoard(){
  const v = validateSender(); if(!v) return;
  const list = loadMessages();
  list.push({id:Date.now()+"_"+Math.random().toString(36).slice(2), name:v.name, text:v.msg, color:selectedColor, ts:Date.now()});
  saveMessages(list);
  document.getElementById("senderName").value = "";
  document.getElementById("senderMsg").value = "";
  document.getElementById("charCount").textContent = "0";
  showToast(`${v.name}さんのメッセージをボードに追加しました！`);
}

/* ---------- BOARD TAB ---------- */
function saveConfig(){
  config.name = document.getElementById("cfgName").value.trim();
  config.date = document.getElementById("cfgDate").value;
  config.email = document.getElementById("cfgEmail").value.trim();
  saveConfigObj();
  refreshHeader();
  showToast("設定を保存しました");
}

function addManual(){
  const name = document.getElementById("manName").value.trim();
  const msg = document.getElementById("manMsg").value.trim();
  if(!name || !msg){ showToast("送信者名とメッセージを入力してください"); return; }
  const list = loadMessages();
  list.push({id:Date.now()+"_"+Math.random().toString(36).slice(2), name, text:msg, color:selectedColorManual, ts:Date.now()});
  saveMessages(list);
  document.getElementById("manName").value = "";
  document.getElementById("manMsg").value = "";
  renderMsgList();
  showToast("追加しました");
}

function renderMsgList(){
  const list = loadMessages();
  document.getElementById("msgCount").textContent = list.length;
  const el = document.getElementById("msgList");
  el.innerHTML = "";
  if(list.length===0){
    el.innerHTML = `<p class="hint">まだメッセージがありません。</p>`;
    return;
  }
  list.slice().reverse().forEach(item=>{
    const div = document.createElement("div");
    div.className = "msg-item";
    div.innerHTML = `
      <div class="dot" style="background:${item.color}"></div>
      <div class="body">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="text">${escapeHtml(item.text)}</div>
      </div>
      <div class="ops">
        <button onclick="deleteMsg('${item.id}')">削除</button>
      </div>`;
    el.appendChild(div);
  });
}

function deleteMsg(id){
  if(!confirm("このメッセージを削除しますか？")) return;
  const list = loadMessages().filter(m=>m.id!==id);
  saveMessages(list);
  renderMsgList();
}

function clearAll(){
  if(!confirm("本当に全てのメッセージを削除しますか？この操作は取り消せません。")) return;
  saveMessages([]);
  renderMsgList();
  showToast("全て削除しました");
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function exportJson(){
  const data = {config, messages: loadMessages()};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `graduation_messages_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const incoming = data.messages || [];
      const current = loadMessages();
      const ids = new Set(current.map(m=>m.id));
      incoming.forEach(m=>{ if(!ids.has(m.id)) current.push(m); });
      saveMessages(current);
      if(data.config){
        config = {...config, ...data.config};
        saveConfigObj();
        refreshHeader();
      }
      renderMsgList();
      showToast(`${incoming.length}件を読み込みました（重複は除外）`);
    }catch(err){
      alert("ファイルの読み込みに失敗しました: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ---------- PRESENTATION ---------- */
function openPresent(){
  const list = loadMessages();
  document.getElementById("presentTitle").textContent = `${config.name || "〇〇"}さん 卒業おめでとう！`;
  document.getElementById("presentSub").textContent = config.date ? `${fmtDate(config.date)}` : "";
  const grid = document.getElementById("boardGrid");
  grid.innerHTML = "";
  list.forEach((item, i)=>{
    const card = document.createElement("div");
    card.className = "note-card";
    const rot = (Math.random()*6-3).toFixed(1);
    card.style.setProperty("--rot", rot+"deg");
    card.style.background = item.color;
    card.style.animationDelay = (i*0.06)+"s";
    card.innerHTML = `<div class="text">${escapeHtml(item.text)}</div><div class="from">— ${escapeHtml(item.name)}</div>`;
    grid.appendChild(card);
  });
  if(list.length===0){
    grid.innerHTML = `<p class="hint" style="grid-column:1/-1;text-align:center">まだメッセージがありません。「ボード（主催者用）」タブから追加してください。</p>`;
  }
  document.getElementById("presentOverlay").classList.remove("hidden");
}
function closePresent(){
  document.getElementById("presentOverlay").classList.add("hidden");
  if(document.fullscreenElement) document.exitFullscreen();
}
function toggleFullscreen(){
  const el = document.getElementById("presentOverlay");
  if(!document.fullscreenElement) el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

/* ---------- INIT ---------- */
buildSwatches("swatches", c=>selectedColor=c, selectedColor);
buildSwatches("swatchesManual", c=>selectedColorManual=c, selectedColorManual);
refreshHeader();
renderMsgList();

/* もしURLに ?mode=board が付いていたら主催者タブを初期表示 */
if(qs.get("mode")==="board") switchTab("board");
</script>
</body>
</html>
